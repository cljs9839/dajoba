function matchScore(seeker, store) {
  if (!seeker || !store) return { score:0, reasons:[] };
  let s = 40; const reasons = [];
  if (seeker.region === store.region) { s += 25; reasons.push('region'); }
  if ((seeker.shifts||[]).some(x => (store.shifts||[]).includes(x))) { s += 20; reasons.push('shift'); }
  if (seeker.visa) { s += 15; reasons.push('visa'); }
  return { score: Math.min(s,98), reasons };
}

const api = {
  async signUp(email, password, name) {
    const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name } } });
    if (error) throw error;
    return data.user;
  },
  async signIn(email, password) {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data.user;
  },
  async signOut() { await sb.auth.signOut(); },

  async getSession() { const { data } = await sb.auth.getSession(); return data.session; },

  async getProfile(uid) {
    const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
    if (error) throw error;
    return data;
  },

  async createSeeker(uid, name, f) {
    const { data, error } = await sb.from('profiles').insert({
      id:uid, role:'SEEKER', name, visa:f.visa, region:f.region, shifts:f.shifts, korean:f.korean,
    }).select().single();
    if (error) throw error;
    return data;
  },

  async createBroker(uid, name, f) {
    const { data, error } = await sb.from('profiles').insert({
      id:uid, role:'BROKER', name, regions:f.regions,
    }).select().single();
    if (error) throw error;
    const { error: e2 } = await sb.from('broker_contacts').insert({ broker_id:uid, contact:f.contact });
    if (e2) throw e2;
    return data;
  },

  // 구직자: 전체 가게 + 등록한 중개자 이름
  async listStores() {
    const { data, error } = await sb.from('stores')
      .select('*, broker:profiles!stores_broker_id_fkey(id,name)')
      .eq('active', true).order('created_at', { ascending:false });
    if (error) throw error;
    return data || [];
  },

  async myStores(uid) {
    const { data, error } = await sb.from('stores').select('*')
      .eq('broker_id', uid).order('created_at', { ascending:false });
    if (error) throw error;
    return data || [];
  },

  async addStore(uid, f) {
    const { data, error } = await sb.from('stores').insert({
      broker_id:uid, name:f.name, biz:f.biz, region:f.region,
      wage:f.wage, headcount:f.headcount, shifts:f.shifts, memo:f.memo || null,
    }).select().single();
    if (error) throw error;
    return data;
  },

  async apply(storeId, uid) {
    const { data, error } = await sb.from('applications')
      .insert({ store_id:storeId, seeker_id:uid }).select().single();
    if (error) throw error;
    return data;
  },

  // 구직자: 내 지원 + 가게 + 중개자
  async myApplications(uid) {
    const { data, error } = await sb.from('applications')
      .select('*, store:stores(*, broker:profiles!stores_broker_id_fkey(id,name))')
      .eq('seeker_id', uid).order('created_at', { ascending:false });
    if (error) throw error;
    return data || [];
  },

  // ⭐ 연락처는 매칭 수락 후에만 서버가 내려줍니다 (RLS)
  async getContacts() {
    const { data, error } = await sb.from('broker_contacts').select('*');
    if (error) return [];
    return data || [];
  },

  // 중개자: 내 가게로 들어온 지원 + 지원자 프로필
  async incoming(uid) {
    const { data, error } = await sb.from('applications')
      .select('*, store:stores!inner(*), seeker:profiles!applications_seeker_id_fkey(*)')
      .eq('store.broker_id', uid).order('created_at', { ascending:false });
    if (error) throw error;
    return data || [];
  },

  async decide(appId, status) {
    const { error } = await sb.from('applications').update({ status }).eq('id', appId);
    if (error) throw error;
  },

  async ledger(uid) {
    const { data, error } = await sb.from('credit_ledger').select('*')
      .eq('broker_id', uid).order('created_at', { ascending:false });
    if (error) throw error;
    return data || [];
  },

  // 내 환산 정보 (credits, tier, rate%, 환산 금액 won)
  async myPayout() {
    const { data, error } = await sb.rpc('my_payout');
    if (error) return null;
    return (data && data[0]) || null;
  },

  // 선착순 현황 (full_count, cap, remaining)
  async payoutStatus() {
    const { data, error } = await sb.rpc('payout_status');
    if (error) return null;
    return (data && data[0]) || null;
  },

  // 실시간: 지원 테이블 변경 감지
  watchApplications(onChange) {
    const ch = sb.channel('apps-live')
      .on('postgres_changes', { event:'*', schema:'public', table:'applications' }, onChange)
      .subscribe();
    return () => sb.removeChannel(ch);
  },
};

function AuthScreen({ t, lang, setLang, onDone }) {

  const [err, setErr] = useState('');

  const ready = mode==='signin'
    ? (email.includes('@') && pw.length>=6)

  const go = async () => {
    setBusy(true); setErr('');

      const user = mode==='signin'
        ? await api.signIn(email.trim(), pw)

  return (
    <Shell>
      <div className="min-h-screen flex flex-col px-6 pt-16 pb-8">
        <div className="flex justify-end mb-6">
          <button onClick={()=>setLang(lang==='ko'?'vi':'ko')} className="h-8 px-3 rounded-full bg-wash text-[13.5px] font-semibold text-sub">

        <h1 className="text-[33.5px] font-bold tight mb-2">{t.appName}</h1>
        <p className="text-[15px] text-sub leading-relaxed mb-9">{t.tagline}</p>

        <div className="space-y-3">
          {mode==='signup' && (
            <Field label={t.name}>
              <input className={inputCls} value={name} onChange={e=>setName(e.target.value)} />
            </Field>
          )}
          <Field label={t.email}>
            <input className={inputCls} type="email" inputMode="email" autoComplete="email"
                   value={email} onChange={e=>setEmail(e.target.value)} />
          </Field>
          <Field label={t.password} hint={t.pwHint}>
            <input className={inputCls} type="password" autoComplete={mode==='signin'?'current-password':'new-password'}
                   value={pw} onChange={e=>setPw(e.target.value)} />
          </Field>
        </div>

        {mode==='signup' && (
          <div className="flex items-start gap-2.5 mt-5">
            <button onClick={()=>setAgree(a=>!a)} aria-pressed={agree}
              className={`w-6 h-6 rounded-md shrink-0 grid place-items-center border-2 ${agree?'bg-seeker border-seeker':'bg-paper border-line'}`}>
              {agree && <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5"><path d="M4 12.5l5.5 5.5L20 7"/></svg>}

              <button onClick={()=>setPolicy(true)} className="underline text-sub">{t.view}</button>
            </div>
          </div>
        )}

        {err && <p className="mt-4 text-[14px] text-danger leading-relaxed">{err}</p>}

        <button disabled={!ready||busy} onClick={go}
          className="w-full h-14 rounded-2xl bg-seeker text-white font-bold text-[18px] disabled:opacity-30">
          {busy ? '...' : (mode==='signin'?t.signIn:t.signUp)}

          className="w-full h-12 text-[15px] text-sub mt-1">
          {mode==='signin'?t.toSignUp:t.toSignIn}
        </button>

        {policy && (

function SeekerApp({ t, lang, setLang, me, onLogout }) {

  const [err, setErr] = useState('');

  const load = useCallback(async () => {
    try {
      setErr('');
      const [st, ap, ct] = await Promise.all([api.listStores(), api.myApplications(me.id), api.getContacts()]);
      setStores(st); setApps(ap); setContacts(ct);
    } catch (e) { setErr(e.message||String(e)); setStores([]); }
  }, [me.id]);

  useEffect(()=>{ load(); }, [load]);
  useEffect(()=> api.watchApplications(load), [load]);

  const appliedIds = apps.map(a=>a.store_id);
  const ranked = (stores||[]).map(s=>({ s, m:matchScore(me,s) })).sort((a,b)=>b.m.score-a.m.score);
  const openCount = apps.filter(a=>a.status==='ACCEPTED').length;
  const contactOf = brokerId => contacts.find(c=>c.broker_id===brokerId)?.contact;

  const doApply = async storeId => {
    try { await api.apply(storeId, me.id); setDetail(null); setTab('APPLIED'); await load(); }
    catch (e) { setErr(e.message||String(e)); }
  };

  const tabs = [
    { key:'HOME', label:t.tabHome },
    { key:'APPLIED', label:t.tabApplied, badge:openCount },
    { key:'ME', label:t.tabMe },
  ];

  return (
    <Shell bar={<TabBar tabs={tabs} active={tab} onChange={setTab} tone="seeker" />}>
      {err && <ErrorBox msg={err} onRetry={load} retryLabel={t.retry} />}

      {tab==='HOME' && (
        <>
          <Header title={t.jobsTitle} right={<span className="num text-[13.5px] text-sub">{ranked.length} {t.places}</span>} />

                <article key={s.id} onClick={()=>setDetail({s,m})} className="rounded-2xl border border-line p-4 active:bg-wash cursor-pointer">
                  <div className="flex items-start justify-between gap-3 mb-2.5">
                    <div className="min-w-0">
                      <h3 className="text-[18px] font-bold tight truncate">{s.name}</h3>
                      <p className="text-[14px] text-sub mt-0.5">{labelOf('biz',s.biz,lang)} · {labelOf('region',s.region,lang)}</p>
                    </div>
                    <div className="shrink-0 text-right">
                      <div className="num text-[22.5px] font-semibold text-seeker leading-none">{m.score}%</div>
                      <div className="text-[11px] text-sub mt-1">{t.match}</div>
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-1.5 mb-3">
                    <Badge tone="seeker">{t.wage} {won(s.wage)}{t.unit}</Badge>
                    <Badge>{(s.shifts||[]).map(x=>labelOf('shift',x,lang)).join(' · ')}</Badge>
                    <Badge>{t.hiring} {s.headcount}{t.people}</Badge>
                  </div>
                  <div className="flex items-center gap-2 pt-3 border-t border-line">
                    <Avatar name={s.broker?.name} tone="broker" size={24} />
                    <span className="text-[13.5px] text-sub flex-1 truncate">
                      {t.introducedBy} <b className="text-ink font-semibold">{s.broker?.name}</b>
                    </span>
                    {appliedIds.includes(s.id) && <Badge>{t.applied}</Badge>}
                  </div>
                </article>
              ))}
            </div>
          )}
        </>

function BrokerApp({ t, lang, setLang, me, refreshMe, onLogout }) {
  const [tab, setTab] = useState('STORES');
  const [stores, setStores] = useState(null);
  const [incoming, setIncoming] = useState([]);
  const [ledger, setLedger] = useState([]);
  const [payout, setPayout] = useState(null);
  const [seats, setSeats] = useState(null);
  const [formOpen, setFormOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [fx, setFx] = useState(null);

  const load = useCallback(async () => {
    try {
      setErr('');
      const [st, inc, lg, pay, seat] = await Promise.all([api.myStores(me.id), api.incoming(me.id), api.ledger(me.id), api.myPayout(), api.payoutStatus()]);
      setStores(st); setIncoming(inc); setLedger(lg); setPayout(pay); setSeats(seat);
    } catch (e) { setErr(e.message||String(e)); setStores([]); }
  }, [me.id]);

  useEffect(()=>{ load(); }, [load]);
  useEffect(()=> api.watchApplications(load), [load]);

  const bump = a => { setFx(a); setTimeout(()=>setFx(null), 1700); };

  const addStore = async d => {
    setBusy(true);
    try { await api.addStore(me.id, d); setFormOpen(false); await load(); await refreshMe(); bump(CREDIT.STORE); }
    catch (e) { setErr(e.message||String(e)); }
    setBusy(false);
  };

  const decide = async (id, status) => {
    try {
      await api.decide(id, status);
      await load(); await refreshMe();
      if (status==='ACCEPTED') bump(CREDIT.MATCH);
      if (status==='HIRED') bump(CREDIT.FIRSTDAY);
    } catch (e) { setErr(e.message||String(e)); }
  };

  const pending = incoming.filter(a=>a.status==='PENDING');
  const tabs = [
    { key:'STORES', label:t.tabStores },
    { key:'INCOMING', label:t.tabIncoming, badge:pending.length },
    { key:'CREDIT', label:t.tabCredit },
    { key:'ME', label:t.tabMe },
  ];

  return (
    <Shell bar={<TabBar tabs={tabs} active={tab} onChange={setTab} tone="broker" />}>
      {seats && tab !== 'CREDIT' && <SeatsBadge t={t} seats={seats} />}
      {err && <ErrorBox msg={err} onRetry={load} retryLabel={t.retry} />}

      {tab==='STORES' && (
        <>
          <Header title={t.tabStores} right={<span className="num text-[13.5px] text-sub">{(stores||[]).length} {t.places}</span>} />
          <div className="p-5 space-y-3">
            <button onClick={()=>setFormOpen(true)}
              className="w-full h-14 rounded-2xl border-2 border-dashed border-broker/45 text-broker font-bold text-[17px] flex items-center justify-center gap-2">
              <span className="text-[22.5px] leading-none">+</span>{t.addStore}
              <span className="num text-[14px]">+{won(CREDIT.STORE)} C</span>
            </button>
            {stores===null ? <Spinner label={t.loading} /> : (<>
              {stores.length===0 && <Empty title={t.emptyStores} body={t.emptyStoresSub} />}
              {stores.map(s=>{
                const n = incoming.filter(a=>a.store_id===s.id).length;
                return (
                  <div key={s.id} className="rounded-2xl border border-line p-4">
                    <div className="flex items-start justify-between gap-2">
                      <div className="min-w-0">
                        <h3 className="text-[17.5px] font-bold tight truncate">{s.name}</h3>
                        <p className="text-[14px] text-sub mt-0.5">
                          {labelOf('biz',s.biz,lang)} · {labelOf('region',s.region,lang)} · {t.wage} {won(s.wage)}{t.unit}
                        </p>
                      </div>
                      <Badge tone={n?'broker':'gray'}>{t.tabIncoming} {n}</Badge>
                    </div>
                  </div>
                );
              })}
            </>)}
          </div>
        </>
      )}

      {tab==='INCOMING' && (
        <>
          <Header title={t.incoming} />
          <div className="p-5 space-y-3">
            {incoming.length===0 && <Empty title={t.emptyIncoming} body={t.emptyIncomingSub} />}
            {incoming.map(a=>{
              const sk = a.seeker, s = a.store, m = matchScore(sk, s);
              return (
                <article key={a.id} className={`rounded-2xl border p-4 ${a.status==='PENDING'?'border-broker/45':'border-line'}`}>
                  <div className="flex items-center gap-3 mb-3">
                    <Avatar name={sk?.name} tone="seeker" size={42} />
                    <div className="min-w-0 flex-1">
                      <div className="text-[17px] font-bold truncate">{sk?.name}</div>
                      <div className="text-[13.5px] text-sub truncate">{s?.name}</div>
                    </div>
                    <div className="num text-[18px] font-semibold text-seeker shrink-0">{m.score}%</div>
                  </div>
                  <div className="flex flex-wrap gap-1.5 mb-3">
                    <Badge tone="seeker">{sk?.visa}</Badge>
                    <Badge>{labelOf('region',sk?.region,lang)}</Badge>
                    <Badge>{(sk?.shifts||[]).map(x=>labelOf('shift',x,lang)).join(' · ')}</Badge>
                    <Badge>{t.korean} {labelOf('korean',sk?.korean,lang)}</Badge>
                  </div>
                  {a.status==='PENDING' && (
                    <div className="flex gap-2">
                      <button onClick={()=>decide(a.id,'REJECTED')} className="h-12 px-5 rounded-xl border border-line text-[15.5px] font-semibold text-sub">{t.reject}</button>
                      <button onClick={()=>decide(a.id,'ACCEPTED')} className="flex-1 h-12 rounded-xl bg-broker text-white text-[17px] font-bold flex items-center justify-center gap-1.5">
                        {t.accept}<span className="num text-[13.5px] opacity-90">+{won(CREDIT.MATCH)} C</span>
                      </button>
                    </div>
                  )}
                  {a.status==='ACCEPTED' && (
                    <div className="flex items-center gap-2">
                      <Badge tone="ok">{t.stAccepted}</Badge>
                      <button onClick={()=>decide(a.id,'HIRED')} className="flex-1 h-12 rounded-xl bg-ok text-white text-[17px] font-bold flex items-center justify-center gap-1.5">
                        {t.confirmFirstDay}<span className="num text-[13.5px] opacity-90">+{won(CREDIT.FIRSTDAY)} C</span>
                      </button>
                    </div>
                  )}
                  {a.status==='HIRED' && <Badge tone="ok">{t.stHired} · {t.settledTarget}</Badge>}
                  {a.status==='REJECTED' && <Badge>{t.rejected}</Badge>}
                </article>
              );
            })}
          </div>
        </>
      )}

      {tab==='CREDIT' && <CreditPage t={t} lang={lang} me={me} ledger={ledger} fx={fx} payout={payout} />}
      {tab==='ME' && <MePage t={t} lang={lang} setLang={setLang} me={me} onLogout={onLogout} roleTxt={t.roleBroker} tone="broker" />}

      {formOpen && (
        <Sheet onClose={()=>setFormOpen(false)}>
          <StoreForm t={t} lang={lang} me={me} busy={busy} onClose={()=>setFormOpen(false)} onSave={addStore} />
        </Sheet>
      )}
    </Shell>
  );
}

  return (
    <div className="fixed z-30 right-4 bottom-28 pointer-events-none">
      <div className={`pointer-events-auto rounded-2xl shadow-lg px-4 py-3 text-center min-w-[92px] ${
        closed ? 'bg-wash border border-line' : 'bg-broker'}`}>
        {closed ? (
          <>
            <div className="text-[12px] font-bold text-sub">{t.seatsTitle}</div>
            <div className="text-[15px] font-bold tight text-sub mt-0.5">{t.seatsClosed}</div>

        ) : (
          <>
            <div className="text-[11px] font-semibold text-white/85 leading-tight">{t.seatsTitle}</div>

}

function CreditPage({ t, lang, me, ledger, fx, payout }) {
  const tier = tierOf(me.credits);
  const nt = nextTier(me.credits);
  const pct = nt ? Math.min(100, Math.round(me.credits/nt.min*100)) : 100;
  const kindTxt = { STORE:t.ruleStore, MATCH:t.ruleMatch, FIRSTDAY:t.ruleFirst };

  // 환산 정보: 서버가 준 payout 이 있으면 그걸, 없으면 잠정 100%
  const rate  = payout ? payout.rate : 100;
  const wonAmt = payout ? payout.won : me.credits;
  const isPartial = rate < 100;

  return (
    <>
      <Header title={t.tabCredit} />
      <div className="p-5 space-y-5">
        <div className="rounded-2xl bg-ink text-white p-5 relative overflow-hidden">
          {fx && <div className="absolute right-5 top-12 num text-[18px] font-bold text-credit credit-pop">+{won(fx)} C</div>}
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[13.5px] text-white/60">{t.myCredit}</span>
            <span className="text-[12.5px] font-semibold px-2 py-0.5 rounded-md" style={{ background:tier.color+'26', color:tier.color }}>{tier[lang]}</span>
          </div>
          <div className="flex items-baseline gap-1.5">
            <span className="num text-[40.5px] font-semibold leading-none tracking-tight">{won(me.credits)}</span>
            <span className="text-[17px] text-white/60 font-semibold">C</span>
          </div>
          {/* 환산 금액 — tier 반영 */}
          <div className="text-[13.5px] text-white/50 mt-1">
            = {won(wonAmt)} {t.worth}
            <span className={`ml-1.5 ${isPartial ? 'text-danger' : 'text-credit'}`}>
              ({t.rateLabel} {rate}%)
            </span>
          </div>
          {isPartial
            ? <div className="mt-2 text-[12.5px] text-danger">{t.payoutPartial} · {t.payoutPartialNote}</div>
            : <div className="mt-2 text-[12.5px] text-credit">{t.payoutFull}</div>}
          <div className="mt-5">
            <div className="h-1.5 rounded-full bg-white/15 overflow-hidden">
              <div className="h-full rounded-full transition-all duration-700" style={{ width:pct+'%', background:tier.color }} />
            </div>
            <div className="flex justify-between mt-2 text-[12.5px] text-white/50">
              <span>{nt ? `${nt[lang]} ${t.toNext} ${won(nt.min-me.credits)} C` : t.maxTier}</span>
              <span className="num">{won(WITHDRAW_MIN)} C {t.withdrawFrom}</span>
            </div>
          </div>
        </div>

        <button disabled={me.credits<WITHDRAW_MIN}
          className="w-full py-3.5 rounded-2xl bg-credit text-white font-bold text-[17px] disabled:bg-wash disabled:text-sub">
          {me.credits>=WITHDRAW_MIN ? t.withdraw : `${won(WITHDRAW_MIN)} C ${t.withdrawLocked}`}
        </button>

        <section>
          <h3 className="text-[15.5px] font-bold tight mb-2.5">{t.earnRules}</h3>
          <div className="grid grid-cols-3 gap-2">
            {[[t.ruleStore,CREDIT.STORE],[t.ruleMatch,CREDIT.MATCH],[t.ruleFirst,CREDIT.FIRSTDAY]].map(([l,v])=>(
              <div key={l} className="rounded-xl border border-line p-3 text-center">
                <div className="num text-[17px] font-semibold text-broker">+{won(v)}</div>
                <div className="text-[12px] text-sub mt-1 leading-tight">{l}</div>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h3 className="text-[15.5px] font-bold tight mb-2.5">{t.history}</h3>
          {ledger.length===0 && <Empty title={t.emptyHistory} />}
          <div className="space-y-1.5">
            {ledger.map(l=>(
              <div key={l.id} className="flex items-center justify-between py-3 px-4 rounded-xl bg-wash">
                <div className="min-w-0">
                  <div className="text-[15px] font-semibold truncate">{kindTxt[l.kind]||l.kind}</div>
                  <div className="text-[12.5px] text-sub num">{new Date(l.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
                </div>
                <div className="num text-[15.5px] font-bold text-broker shrink-0">+{won(l.amount)} C</div>
              </div>
            ))}
          </div>
        </section>
      </div>
    </>
  );
}

function App() {
  const [lang, setLang] = useState('vi');
  const [booting, setBooting] = useState(true);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [role, setRole] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const t = I18N[lang];

  const loadProfile = useCallback(async (uid) => {
    try { setProfile(await api.getProfile(uid)); }
    catch (e) { setErr(e.message||String(e)); }
  }, []);

  const boot = useCallback(async () => {
    const s = await api.getSession();
    setSession(s);
    if (s) await loadProfile(s.user.id);
    setBooting(false);
  }, [loadProfile]);

  useEffect(()=>{ if (CONFIGURED) boot(); else setBooting(false); }, [boot]);

  useEffect(()=>{
    if (!CONFIGURED) return;
    const { data } = sb.auth.onAuthStateChange((_e, s) => {
      setSession(s);
      if (s) loadProfile(s.user.id); else setProfile(null);
    });
    return () => data.subscription.unsubscribe();
  }, [loadProfile]);

  if (!CONFIGURED) return <SetupScreen />;
  if (booting) return <Shell><Spinner label={t.loading} /></Shell>;
  if (!session) return <AuthScreen t={t} lang={lang} setLang={setLang} onDone={boot} />;

  const uid = session.user.id;
  const displayName = session.user.user_metadata?.name || session.user.email.split('@')[0];

  // 프로필이 아직 없으면 역할 선택 → 온보딩
  if (!profile) {
    if (!role) return <RoleScreen t={t} onPick={setRole} />;

    const saveSeeker = async f => {
      setBusy(true); setErr('');
      try { setProfile(await api.createSeeker(uid, displayName, f)); }
      catch (e) { setErr(e.message||String(e)); }
      setBusy(false);
    };
    const saveBroker = async f => {
      setBusy(true); setErr('');
      try { setProfile(await api.createBroker(uid, displayName, f)); }
      catch (e) { setErr(e.message||String(e)); }
      setBusy(false);
    };

    return role==='SEEKER'
      ? <SeekerOnboard t={t} lang={lang} busy={busy} err={err} onSave={saveSeeker} />
      : <BrokerOnboard t={t} lang={lang} busy={busy} err={err} onSave={saveBroker} />;
  }

  const logout = async () => { await api.signOut(); setProfile(null); setRole(null); setSession(null); };
  const refreshMe = () => loadProfile(uid);

  return profile.role==='SEEKER'
    ? <SeekerApp t={t} lang={lang} setLang={setLang} me={profile} onLogout={logout} />
    : <BrokerApp t={t} lang={lang} setLang={setLang} me={profile} refreshMe={refreshMe} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
